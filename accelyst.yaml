projectParts:
  - name: client
    directoryAbs: /home/zach/workspace/myproject/client
    documentationAbs: /home/zach/workspace/myproject/docs/client.md
  - name: server
    directoryAbs: /home/zach/workspace/myproject/server
  - name: database
    directoryAbs: /home/zach/workspace/myproject/db
    documentationAbs: /home/zach/workspace/myproject/docs/schema.md

milestones:
  - id: update_ui_style
    name: "Update UI Style"
    dependsOn: []
    steps:
      - id: research_tailwind
        instruction: "use context7 and search to pull the tailwind v4 documentation"
        dependsOn: []
        projectParts: []
      - id: research_lit
        instruction: "use context7 and search to pull the lit webcomponents documentation"
        dependsOn: []
        projectParts: []
      - id: analyze_client
        instruction: "analyze the client implementation"
        dependsOn: []
        projectParts:
          - client
      - id: migrate_client
        instruction: "migrate the existing client html/css to use tailwind and lit webcomponents, update the styling and layout to be simple and delightful"
        dependsOn:
          - research_tailwind
          - research_lit
          - analyze_client
        projectParts:
          - client

  - id: add_api_endpoint
    name: "Add API Endpoint"
    dependsOn: []
    steps:
      - id: review_api
        instruction: "review existing API patterns"
        dependsOn: []
        projectParts:
          - server
      - id: review_schema
        instruction: "review database schema"
        dependsOn: []
        projectParts:
          - database
      - id: impl_endpoint
        instruction: "implement new endpoint following existing patterns"
        dependsOn:
          - review_api
          - review_schema
        projectParts:
          - server
      - id: add_migrations
        instruction: "add database migrations if needed"
        dependsOn:
          - impl_endpoint
        projectParts:
          - database
      - id: write_tests
        instruction: "write integration tests"
        dependsOn:
          - impl_endpoint
          - add_migrations
        projectParts:
          - server

  - id: integrate_ui_api
    name: "Integrate UI with API"
    dependsOn:
      - update_ui_style
      - add_api_endpoint
    steps:
      - id: impl_api_client
        instruction: "implement API client in frontend"
        dependsOn: []
        projectParts:
          - client
      - id: wire_components
        instruction: "wire UI components to API endpoints"
        dependsOn:
          - impl_api_client
        projectParts:
          - client
      - id: configure_cors
        instruction: "configure CORS settings in production environment"
        dependsOn:
          - wire_components
        projectParts: []
